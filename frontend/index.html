<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- Tints the browser chrome on mobile to match --bg, instead of leaving it
         the platform default beside a light page. -->
    <meta name="theme-color" content="#f2f5f8" />
    <title>StriX Scene Explorer - SAR mission-planning console</title>
    <meta
      name="description"
      content="An operator console for SAR satellite mission planning: access windows, TLE-derived ground tracks and product metadata for the StriX constellation."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://web-g7vdca6wsq-an.a.run.app/" />

    <!-- Without these the link renders as a bare run.app hostname wherever it is
         shared, and since the body is an empty #root there is nothing for an
         unfurler to fall back on - none of them execute JavaScript. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StriX Scene Explorer" />
    <meta
      property="og:description"
      content="An operator console for SAR satellite mission planning: access windows, TLE-derived ground tracks and product metadata."
    />
    <meta property="og:url" content="https://web-g7vdca6wsq-an.a.run.app/" />
    <meta property="og:image" content="https://web-g7vdca6wsq-an.a.run.app/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Ground tracks of the eight StriX satellites across a world grid, with four standing targets marked."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>

    <!-- The console needs JavaScript and WebGL. Saying so beats a white page,
         and gives a crawler and a reader something either can use. -->
    <noscript>
      <div style="max-width: 42rem; margin: 4rem auto; padding: 0 16px; font: 15px/1.6 system-ui; color: #131c26">
        <h1 style="font-size: 28px">StriX Scene Explorer</h1>
        <p>
          An operator console for SAR satellite mission planning: it shows acquisition footprints,
          ground tracks propagated from public two-line element sets, and the access windows during
          which a target can be imaged.
        </p>
        <p>
          It renders its map with WebGL, so it needs JavaScript enabled. The source, the Python
          notebooks behind the orbital maths, and the reasoning are at
          <a href="https://github.com/NikoMastro/SynspectiveDemoReel">github.com/NikoMastro/SynspectiveDemoReel</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Repeated in every location block on purpose.
#
# nginx's add_header is not additive across levels: a block that declares any
# add_header of its own silently drops every one inherited from its parent.
# `location /assets/` already sets Cache-Control, so headers declared once at
# server level would be present on / and absent on every hashed asset - the
# worst outcome, because it looks configured.
#
# The CSP is tight because it can be. The bundle was checked rather than
# guessed: no eval, no new Function, no WebAssembly, so no 'unsafe-eval'. The
# only external origin is the OpenStreetMap tile server. loaders.gl builds its
# worker from a blob URL, hence worker-src blob:, and deck.gl injects one
# <style> element, hence 'unsafe-inline' for styles only - never for scripts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://tile.openstreetmap.org; worker-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;

# The full URL would otherwise travel to tile.openstreetmap.org on every tile.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# frame-ancestors above covers modern browsers; this is for the ones that do not
# implement it.
add_header X-Frame-Options "DENY" always;

# Nothing here uses any of them.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;

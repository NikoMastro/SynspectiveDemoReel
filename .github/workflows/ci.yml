name: CI

on:
  push:
    branches: ['**']
  pull_request:

# This workflow builds and tests; it never writes to the repository. The default
# token is broader than that, and narrowing it costs two lines.
permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      # Formatting is not a matter of taste in Go, so it is a build failure
      # rather than a review comment.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go build ./...
      - run: go vet ./...

      # -race because the access sweep fans out over goroutines, and a data
      # race there would otherwise only show up as an occasional wrong answer.
      # The tests read ../fixtures, which is why the whole repo is checked out.
      - run: go test -race -count=1 ./...

  frontend:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs the lockfile exactly and fails if
      # package.json has drifted from it.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  images:
    name: Docker
    runs-on: ubuntu-latest
    # No point building images from code that does not compile or pass.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: this proves the Dockerfiles work and that the
      # build context stays small. Pushing to Artifact Registry needs GCP
      # credentials, which this repository does not hold.
      - name: Build all three images
        run: docker compose build

      - name: Report image sizes
        run: docker images --format '{{.Repository}}  {{.Size}}' | grep synspective
